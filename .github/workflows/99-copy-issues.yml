name: 99 - Copy issues from starter repo

env:
  GH_TOKEN: ${{ github.token }}
  STARTER: ucsb-cs156/proj-dining
  DEST: ${{ github.repository }}
  TAG: ${{ vars.QXX }}

on:
  workflow_dispatch:

permissions:
  issues: write

jobs:
  copy-issues:
    name: Copy issues and subissues from starter repo
    runs-on: ubuntu-latest
    steps:
      - name: Install gh-sub-issue extension
        run: gh extension install yahsan2/gh-sub-issue

      - name: Copy issues and subissues
        run: |
          set -euo pipefail
          declare -A MAP

          echo "=== Pass 1: create issues ==="
          for n in $(gh issue list -R "$STARTER" -s open -l "$TAG" -L 500 --json number --jq '.[].number' | sort -n); do
            title=$(gh issue view "$n" -R "$STARTER" --json title --jq .title)
            body=$(gh issue view "$n" -R "$STARTER" --json body --jq .body)
            mapfile -t label_names < <(gh issue view "$n" -R "$STARTER" --json labels --jq '.labels[].name')

            args=(--title "$title" --body "${body:-(no description)}")
            for label in "${label_names[@]}"; do
              # create the label in the destination if it doesn't exist yet
              gh label create "$label" -R "$DEST" >/dev/null 2>&1 || true
              args+=(--label "$label")
            done

            url=$(gh issue create -R "$DEST" "${args[@]}")
            MAP[$n]=${url##*/}
            echo "starter #$n -> $DEST #${MAP[$n]}"
            sleep 1
          done

          echo "=== Pass 2: link subissues ==="
          for parent in "${!MAP[@]}"; do
            children=$(gh sub-issue list "$parent" --repo "$STARTER" --relation children --json number -L 100 | jq -r '(.subIssues // [])[].number')
            for child in $children; do
              if [[ -n "${MAP[$child]:-}" ]]; then
                echo "linking $DEST #${MAP[$child]} under #${MAP[$parent]}"
                gh sub-issue add "${MAP[$parent]}" "${MAP[$child]}" --repo "$DEST"
                sleep 1
              fi
            done
          done